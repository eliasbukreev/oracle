name = "oracle-worker"
main = "src/index.ts"
compatibility_date = "2025-09-05"
workers_dev = true

[observability]
enabled = true

[[ratelimits]]
name = "ORACLE_PER_IP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "ORACLE_GLOBAL_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 100
  period = 60
