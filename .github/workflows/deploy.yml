name: Deploy Oracle

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oracle-deploy
  cancel-in-progress: true

jobs:
  worker-check:
    name: Check Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck Worker
        working-directory: worker
        run: npm run check

      - name: Lint Worker
        working-directory: worker
        run: npm run lint

      - name: Test Worker
        working-directory: worker
        run: npm run test

      - name: Deploy Worker
        if: github.event_name == 'push'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ORACLE_PROVIDER: ${{ vars.ORACLE_PROVIDER }}
          ORACLE_FALLBACK_PROVIDER: ${{ vars.ORACLE_FALLBACK_PROVIDER }}
          ORACLE_MAX_TOKENS: ${{ vars.ORACLE_MAX_TOKENS }}
          ORACLE_TEMPERATURE: ${{ vars.ORACLE_TEMPERATURE }}
          ORACLE_TIMEOUT: ${{ vars.ORACLE_TIMEOUT }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          npx wrangler deploy \
            --var "GEMINI_MODEL:${GEMINI_MODEL}" \
            --var "OPENROUTER_MODEL:${OPENROUTER_MODEL}" \
            --var "GROQ_MODEL:${GROQ_MODEL}" \
            --var "ORACLE_PROVIDER:${ORACLE_PROVIDER}" \
            --var "ORACLE_FALLBACK_PROVIDER:${ORACLE_FALLBACK_PROVIDER}" \
            --var "ORACLE_MAX_TOKENS:${ORACLE_MAX_TOKENS}" \
            --var "ORACLE_TEMPERATURE:${ORACLE_TEMPERATURE}" \
            --var "ORACLE_TIMEOUT:${ORACLE_TIMEOUT}" \
            --var "CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}"

  frontend:
    name: Build frontend
    needs: worker-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Generate static site
        working-directory: frontend
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_ORACLE_API_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: npm run generate

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.output/public

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
