name: Deploy Oracle

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oracle-deploy
  cancel-in-progress: true

jobs:
  worker-check:
    name: Check Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck Worker
        working-directory: worker
        run: npm run check

      - name: Deploy Worker
        if: github.event_name == 'push'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          GOOGLE_AI_MODEL: ${{ vars.GOOGLE_AI_MODEL }}
          GOOGLE_AI_MAX_TOKENS: ${{ vars.GOOGLE_AI_MAX_TOKENS }}
          GOOGLE_AI_TEMPERATURE: ${{ vars.GOOGLE_AI_TEMPERATURE }}
          GOOGLE_AI_TIMEOUT: ${{ vars.GOOGLE_AI_TIMEOUT }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          printf '%s' "$GOOGLE_AI_API_KEY" | npx wrangler secret put GOOGLE_AI_API_KEY
          npx wrangler deploy \
            --var "GOOGLE_AI_MODEL:${GOOGLE_AI_MODEL}" \
            --var "GOOGLE_AI_MAX_TOKENS:${GOOGLE_AI_MAX_TOKENS}" \
            --var "GOOGLE_AI_TEMPERATURE:${GOOGLE_AI_TEMPERATURE}" \
            --var "GOOGLE_AI_TIMEOUT:${GOOGLE_AI_TIMEOUT}" \
            --var "CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}"

  frontend:
    name: Build frontend
    needs: worker-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate static site
        working-directory: frontend
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_ORACLE_API_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: npm run generate

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/.output/public

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
