name: Deploy Oracle

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "worker/**"
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oracle-deploy
  cancel-in-progress: true

jobs:
  worker-check:
    name: Check Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Check shared
        working-directory: shared
        run: npm run check

      - name: Test shared
        working-directory: shared
        run: npm run test

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck Worker
        working-directory: worker
        run: npm run check

      - name: Lint Worker
        working-directory: worker
        run: npm run lint

      - name: Test Worker
        working-directory: worker
        run: npm run test

      - name: Deploy Worker
        if: github.event_name == 'push'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
          ORCA_MODEL: ${{ vars.ORCA_MODEL }}
          ORACLE_PROVIDER: ${{ vars.ORACLE_PROVIDER }}
          ORACLE_FALLBACK_PROVIDER: ${{ vars.ORACLE_FALLBACK_PROVIDER }}
          ORACLE_MAX_TOKENS: ${{ vars.ORACLE_MAX_TOKENS }}
          ORACLE_TEMPERATURE: ${{ vars.ORACLE_TEMPERATURE }}
          ORACLE_TIMEOUT: ${{ vars.ORACLE_TIMEOUT }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          TAROT_IMAGE_BASE_URL: ${{ vars.TAROT_IMAGE_BASE_URL }}
        run: |
          # Секреты провайдеров опциональны: незаданный не должен ронять деплой.
          for name in OPENROUTER_API_KEY GROQ_API_KEY ORCA_API_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            fi
          done
          npx wrangler deploy \
            --var "OPENROUTER_MODEL:${OPENROUTER_MODEL}" \
            --var "GROQ_MODEL:${GROQ_MODEL}" \
            --var "ORCA_MODEL:${ORCA_MODEL}" \
            --var "ORACLE_PROVIDER:${ORACLE_PROVIDER}" \
            --var "ORACLE_FALLBACK_PROVIDER:${ORACLE_FALLBACK_PROVIDER}" \
            --var "ORACLE_MAX_TOKENS:${ORACLE_MAX_TOKENS}" \
            --var "ORACLE_TEMPERATURE:${ORACLE_TEMPERATURE}" \
            --var "ORACLE_TIMEOUT:${ORACLE_TIMEOUT}" \
            --var "CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}" \
            --var "TAROT_IMAGE_BASE_URL:${TAROT_IMAGE_BASE_URL}"

  frontend:
    name: Build frontend
    needs: worker-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        working-directory: shared
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Generate static site
        working-directory: frontend
        env:
          NUXT_APP_BASE_URL: ${{ vars.SITE_BASE_PATH }}
          NUXT_PUBLIC_ORACLE_API_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run generate

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/.output/public

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
