name: Security

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'

permissions:
  contents: read

concurrency:
  group: oracle-security
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: results.sarif

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@7999b86c43a865dc79d8923397f35af22de63401 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --audit-level=moderate

      # Фронт: часть advisory без патчей upstream — исключения с причинами
      # в frontend/audit-ci.jsonc (dev-only экспозиция, прод — статика).
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npx audit-ci --moderate --config ./audit-ci.jsonc
